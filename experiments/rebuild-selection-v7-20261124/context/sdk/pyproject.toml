[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contest-harness"
version = "1.0.2"
description = "Participant SDK for contest.harness.workspace.v2"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
contest-harness = "contest_harness.cli:entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["contest_harness*"]
