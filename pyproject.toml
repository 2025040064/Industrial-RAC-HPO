[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "industrial-rac-hpo"
version = "0.3.0"
description = "Reproducible industrial regression training and hyperparameter search"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.16.3",
  "scikit-learn==1.7.2",
  "lightgbm==4.6.0",
  "optuna==4.5.0",
  "PySide6==6.9.3",
  "matplotlib==3.10.7",
  "pydantic==2.12.3",
  "PyYAML==6.0.3",
  "ucimlrepo==0.0.7",
  "xgboost==3.1.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
rac-hpo = "rac_hpo.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rac_hpo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
cache_dir = ".cache/pytest-state"

[tool.ruff]
line-length = 100
